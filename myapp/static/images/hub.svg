<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="ฮับ USB-C 7 ช่อง">
  <!-- hub.svg — ฮับ USB-C 7-in-1 · สไตล์เดียวกับ mouse.svg -->
  <defs>
    <linearGradient id="hbBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfdfe"/><stop offset="0.5" stop-color="#dfe3ea"/><stop offset="1" stop-color="#a8aeb9"/>
    </linearGradient>
    <linearGradient id="hbFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#333944"/><stop offset="1" stop-color="#16191f"/>
    </linearGradient>
    <linearGradient id="hbSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.58" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="hbDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#1d1d1f" flood-opacity="0.22"/>
    </filter>
  </defs>

  <ellipse cx="400" cy="560" rx="252" ry="26" fill="#1d1d1f" opacity="0.12"/>

  <g filter="url(#hbDrop)">
    <!-- ตัวฮับแบนเตี้ย -->
    <rect x="152" y="312" width="496" height="212" rx="40" fill="url(#hbBody)"/>
    <rect x="152" y="312" width="496" height="212" rx="40" fill="url(#hbSheen)"/>
    <rect x="152" y="500" width="496" height="24" rx="12" fill="#9aa0ae" opacity="0.5"/>

    <!-- แผลด้านบน (สีเข้ม แยกจากตัว) -->
    <rect x="180" y="338" width="440" height="160" rx="28" fill="url(#hbFace)"/>

    <!-- พอร์ตเรียง: 2× HDMI · 2× USB-A · USB-C · LAN -->
    <g fill="#0c0f14">
      <rect x="208" y="366" width="72" height="24" rx="7"/>
      <rect x="294" y="366" width="72" height="24" rx="7"/>
      <rect x="208" y="404" width="72" height="24" rx="7"/>
      <rect x="294" y="404" width="72" height="24" rx="7"/>
    </g>
    <g fill="#0c0f14">
      <rect x="392" y="364" width="34" height="12" rx="6"/>
      <rect x="392" y="390" width="34" height="12" rx="6"/>
      <rect x="392" y="416" width="34" height="12" rx="6"/>
      <rect x="440" y="364" width="34" height="12" rx="6"/>
      <rect x="440" y="390" width="34" height="12" rx="6"/>
      <rect x="440" y="416" width="34" height="12" rx="6"/>
    </g>
    <rect x="506" y="378" width="44" height="18" rx="9" fill="#0c0f14"/>
    <rect x="506" y="408" width="44" height="18" rx="9" fill="#0c0f14"/>
    <!-- ป้ายบอกว่าอะไรคืออะไร (ข้อความเล็ก อ่านได้เมื่อซูม) -->
    <g fill="#8b91a0" font-family="-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600">
      <text x="244" y="452" text-anchor="middle">HDMI</text>
      <text x="330" y="452" text-anchor="middle">USB</text>
      <text x="433" y="452" text-anchor="middle">USB</text>
    </g>
    <!-- ไฟสถานะ + ขา USB-C ต่อกลับ -->
    <circle cx="594" cy="418" r="9" fill="#0071e7"/>
    <circle cx="594" cy="418" r="19" fill="#0071e7" opacity="0.2"/>
    <rect x="662" y="386" width="52" height="30" rx="14" fill="#3a3f4b"/>
  </g>
</svg>