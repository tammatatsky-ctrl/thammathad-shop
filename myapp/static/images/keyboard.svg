<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="คีย์บอร์ด Mechanical">
  <!-- keyboard.svg — คีย์บอร์ด Mechanical (มุมมองบน) · สไตล์เดียวกับ mouse.svg -->
  <defs>
    <linearGradient id="kbBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfe"/><stop offset="1" stop-color="#cdd1da"/>
    </linearGradient>
    <linearGradient id="kbKey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f8"/><stop offset="1" stop-color="#b9bec9"/>
    </linearGradient>
    <linearGradient id="kbKeyAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ea0f0"/><stop offset="1" stop-color="#0063c5"/>
    </linearGradient>
    <linearGradient id="kbSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="kbDrop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#1d1d1f" flood-opacity="0.22"/>
    </filter>
  </defs>

  <ellipse cx="400" cy="632" rx="262" ry="30" fill="#1d1d1f" opacity="0.13"/>

  <g filter="url(#kbDrop)">
    <!-- โครงเครื่อง -->
    <rect x="96" y="266" width="608" height="326" rx="30" fill="url(#kbBody)"/>
    <rect x="96" y="266" width="608" height="326" rx="30" fill="url(#kbSheen)"/>
    <!-- ขอบล่างให้ความหนา -->
    <rect x="96" y="566" width="608" height="26" rx="13" fill="#9aa0ae" opacity="0.55"/>

    <!-- ถาดคีย์ (จมลงกรอบ) -->
    <rect x="118" y="288" width="564" height="282" rx="18" fill="#aeb3c0" opacity="0.55"/>

    <!-- แถว 1 -->
    <g fill="url(#kbKey)">
      <rect x="136" y="304" width="62" height="46" rx="9"/>
      <rect x="206" y="304" width="62" height="46" rx="9"/>
      <rect x="276" y="304" width="62" height="46" rx="9"/>
      <rect x="346" y="304" width="62" height="46" rx="9"/>
      <rect x="416" y="304" width="62" height="46" rx="9"/>
      <rect x="486" y="304" width="62" height="46" rx="9"/>
      <rect x="556" y="304" width="52" height="46" rx="9"/>
      <rect x="616" y="304" width="50" height="46" rx="9"/>
    </g>
    <!-- แถว 2 -->
    <g fill="url(#kbKey)">
      <rect x="136" y="358" width="80" height="46" rx="9"/>
      <rect x="224" y="358" width="62" height="46" rx="9"/>
      <rect x="294" y="358" width="62" height="46" rx="9"/>
      <rect x="364" y="358" width="62" height="46" rx="9"/>
      <rect x="434" y="358" width="62" height="46" rx="9"/>
      <rect x="504" y="358" width="62" height="46" rx="9"/>
      <rect x="574" y="358" width="92" height="46" rx="9"/>
    </g>
    <!-- แถว 3 -->
    <g fill="url(#kbKey)">
      <rect x="136" y="412" width="94" height="46" rx="9"/>
      <rect x="238" y="412" width="62" height="46" rx="9"/>
      <rect x="308" y="412" width="62" height="46" rx="9"/>
      <rect x="378" y="412" width="62" height="46" rx="9"/>
      <rect x="448" y="412" width="62" height="46" rx="9"/>
      <rect x="518" y="412" width="62" height="46" rx="9"/>
      <rect x="588" y="412" width="78" height="46" rx="9"/>
    </g>
    <!-- แถวล่าง: modifier · spacebar · arrow -->
    <g fill="url(#kbKey)">
      <rect x="136" y="466" width="70" height="46" rx="9"/>
      <rect x="214" y="466" width="70" height="46" rx="9"/>
      <rect x="292" y="466" width="70" height="46" rx="9"/>
      <rect x="592" y="466" width="74" height="46" rx="9"/>
    </g>
    <rect x="370" y="466" width="214" height="46" rx="9" fill="url(#kbKeyAccent)"/>

    <!-- ไฟสถานะ RGB ด้านบน -->
    <circle cx="400" cy="290" r="7" fill="#0071e7"/>
    <circle cx="400" cy="290" r="14" fill="#0071e7" opacity="0.2"/>
  </g>
</svg>