<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="ไมโครโฟน USB สำหรับสตรีม">
  <!-- microphone.svg — ไมค์คอนเดนเซอร์ USB พร้อมขาตั้ง · สไตล์เดียวกับ mouse.svg -->
  <defs>
    <linearGradient id="micBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfdfe"/><stop offset="0.5" stop-color="#dfe3ea"/><stop offset="1" stop-color="#aeb4c0"/>
    </linearGradient>
    <linearGradient id="micGrill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a505c"/><stop offset="1" stop-color="#1c1f27"/>
    </linearGradient>
    <pattern id="micMesh" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="5.5" cy="5.5" r="2.4" fill="#20242c"/>
    </pattern>
    <linearGradient id="micStand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0f4"/><stop offset="1" stop-color="#aeb4c0"/>
    </linearGradient>
    <filter id="micDrop" x="-30%" y="-25%" width="160%" height="155%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#1d1d1f" flood-opacity="0.2"/>
    </filter>
  </defs>

  <ellipse cx="400" cy="650" rx="180" ry="26" fill="#1d1d1f" opacity="0.13"/>

  <g filter="url(#micDrop)">
    <!-- ขาตั้งแบบเหล็ก -->
    <ellipse cx="400" cy="628" rx="168" ry="26" fill="url(#micStand)"/>
    <ellipse cx="400" cy="620" rx="168" ry="26" fill="#f4f6f9"/>
    <rect x="384" y="470" width="32" height="152" rx="14" fill="url(#micStand)"/>
    <circle cx="400" cy="486" r="22" fill="#e6e9ee"/>
    <circle cx="400" cy="486" r="10" fill="#0071e7"/>

    <!-- ตัวไมค์ (แนวตั้ง) -->
    <rect x="344" y="176" width="112" height="308" rx="56" fill="url(#micBody)"/>
    <rect x="356" y="196" width="88" height="182" rx="44" fill="url(#micGrill)"/>
    <rect x="356" y="196" width="88" height="182" rx="44" fill="url(#micMesh)"/>
    <!-- วงแหวนไฟเงินด้านล่าง = จุดเดียวที่มีสี -->
    <rect x="360" y="392" width="80" height="20" rx="10" fill="#0071e7" opacity="0.9"/>
    <rect x="360" y="392" width="80" height="34" rx="17" fill="#0071e7" opacity="0.18"/>
    <!-- ปุ่ม mute + gain -->
    <rect x="366" y="432" width="68" height="16" rx="8" fill="#c6cad4"/>
    <circle cx="400" cy="440" r="5" fill="#0071e7"/>
  </g>
</svg>