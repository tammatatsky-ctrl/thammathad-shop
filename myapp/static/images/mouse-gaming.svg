<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="เมาส์เกมมิง 58g">
  <!-- mouse-gaming.svg — เมาส์เกมมิงน้ำหนักเบา · สไตล์เดียวกับ mouse.svg (ทรงเหลี่ยมกว่า + ช่องระบายอากาศ) -->
  <defs>
    <linearGradient id="gmShell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fb"/><stop offset="0.55" stop-color="#dfe3ea"/><stop offset="1" stop-color="#aeb4c0"/>
    </linearGradient>
    <linearGradient id="gmPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a505c"/><stop offset="1" stop-color="#1c1f27"/>
    </linearGradient>
    <linearGradient id="gmSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="gmDrop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#1d1d1f" flood-opacity="0.22"/>
    </filter>
  </defs>

  <ellipse cx="400" cy="628" rx="198" ry="32" fill="#1d1d1f" opacity="0.13"/>

  <g filter="url(#gmDrop)">
    <!-- ตัวเมาส์ทรงเหลี่ยมมน -->
    <path d="M400 158c-110 0-178 76-178 196v64c0 116 76 202 178 202s178-86 178-202v-64c0-120-68-196-178-196z"
          fill="url(#gmShell)"/>
    <path d="M400 158c-110 0-178 76-178 196v64c0 116 76 202 178 202s178-86 178-202v-64c0-120-68-196-178-196z"
          fill="url(#gmSheen)"/>
    <!-- ฝาคลิกสองข้าง -->
    <path d="M400 162v132" stroke="#a8adba" stroke-width="5" stroke-linecap="round"/>
    <path d="M400 294c-52-6-104-24-144-52M400 294c52-6 104-24 144-52"
          stroke="#c2c7d2" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- ลูกกลิ้ง -->
    <rect x="379" y="212" width="42" height="70" rx="21" fill="url(#gmPanel)"/>
    <rect x="387" y="226" width="26" height="42" rx="13" fill="#5b6070" opacity="0.6"/>

    <!-- ช่องระบายอากาศรูปหักเหลี่ยม (จุดขายของเมาส์เกม) -->
    <g fill="#7d838f" opacity="0.85">
      <path d="M300 360h34l-17 30z"/><path d="M340 380h34l-17 30z"/><path d="M380 398h34l-17 30z"/><path d="M420 380h34l-17 30z"/><path d="M460 360h34l-17 30z"/>
      <path d="M320 420h34l-17 30z"/><path d="M360 440h34l-17 30z"/><path d="M400 458h34l-17 30z"/><path d="M440 440h34l-17 30z"/><path d="M480 420h34l-17 30z"/>
    </g>

    <!-- แถบไฟ RGB ด้านล่าง -->
    <path d="M286 540c72 26 156 26 228 0" fill="none" stroke="#0071e7" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
    <path d="M286 540c72 26 156 26 228 0" fill="none" stroke="#0071e7" stroke-width="20" stroke-linecap="round" opacity="0.16"/>
    <circle cx="400" cy="556" r="9" fill="#0071e7"/>
  </g>
</svg>