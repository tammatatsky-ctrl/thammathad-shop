<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="แขนตั้งจอโต๊ะ">
  <!-- monitor-arm.svg — แขนตั้งจอโต๊ะ (แบบแขนเดียวพร้อมคลิป) · สไตล์เดียวกับ mouse.svg -->
  <defs>
    <linearGradient id="armMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfe"/><stop offset="0.5" stop-color="#d5d9e1"/><stop offset="1" stop-color="#9aa0ae"/>
    </linearGradient>
    <linearGradient id="armDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#454a56"/><stop offset="1" stop-color="#1c1f27"/>
    </linearGradient>
    <linearGradient id="armDesk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f9"/><stop offset="1" stop-color="#cfd3dc"/>
    </linearGradient>
    <filter id="armDrop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#1d1d1f" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- โต๊ะ -->
  <rect x="92" y="604" width="616" height="40" rx="12" fill="url(#armDesk)"/>
  <rect x="92" y="604" width="616" height="12" rx="6" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="400" cy="676" rx="252" ry="22" fill="#1d1d1f" opacity="0.1"/>

  <g filter="url(#armDrop)">
    <!-- คลิปหนีบโต๊ะ -->
    <path d="M188 596h74a14 14 0 0 1 14 14v54a14 14 0 0 1-14 14h-74a14 14 0 0 1-14-14v-54a14 14 0 0 1 14-14z"
          fill="url(#armDark)"/>
    <rect x="190" y="672" width="70" height="26" rx="8" fill="#5f6572"/>

    <!-- ต้นแขนตั้งขึ้น -->
    <rect x="206" y="400" width="38" height="200" rx="17" fill="url(#armMetal)"/>
    <!-- ข้อต่อ -->
    <circle cx="225" cy="402" r="27" fill="url(#armDark)"/>
    <circle cx="225" cy="402" r="11" fill="#0071e7"/>
    <!-- แขนยืดออก -->
    <rect x="225" y="366" width="290" height="38" rx="19" fill="url(#armMetal)"/>
    <!-- ข้อต่อปลายแขน -->
    <circle cx="496" cy="385" r="27" fill="url(#armDark)"/>
    <circle cx="496" cy="385" r="11" fill="#0071e7"/>
    <!-- แผงยึดจอ VESA -->
    <rect x="482" y="292" width="150" height="100" rx="16" fill="url(#armMetal)"/>
    <rect x="516" y="312" width="82" height="60" rx="9" fill="url(#armDark)"/>
    <circle cx="536" cy="332" r="6" fill="#5f6572"/>
    <circle cx="578" cy="332" r="6" fill="#5f6572"/>
    <circle cx="536" cy="352" r="6" fill="#5f6572"/>
    <circle cx="578" cy="352" r="6" fill="#5f6572"/>
    <!-- สายจัดการ -->
    <path d="M512 392c-14 34-6 62 22 84" fill="none" stroke="#aeb4c0" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>