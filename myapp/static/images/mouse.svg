<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="เมาส์ไร้สาย">
  <!--
    mouse.svg — ภาพทดแทนสินค้า "เมาส์ไร้สาย"
    ทำไมเป็น SVG: prod1.jpg เดิมเป็นรูปยางแก้ว (placeholder ที่ไม่ตรงกับสินค้า)
    พื้นหลังใส เพื่อให้วางบนการ์ดขาวของ product_grid.html ได้กลืนกับ prod2/pro3
    โทนสีตรงกับธีม (แก้ว/ฟ้าแอปเปิล) และไม่มีข้อความในภาพ (alt text ของ <img> รับหน้าที่นี้แล้ว)
  -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbfd"/>
      <stop offset="0.55" stop-color="#e6e8ee"/>
      <stop offset="1" stop-color="#c8ccd6"/>
    </linearGradient>
    <linearGradient id="shellEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9aa0ae"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f5c"/>
      <stop offset="1" stop-color="#1c1f27"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#1d1d1f" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- เงาสัมผัสพื้น -->
  <ellipse cx="400" cy="618" rx="196" ry="34" fill="#1d1d1f" opacity="0.13"/>

  <g filter="url(#drop)">
    <!-- ตัวเมาส์: ทรงแอปเปิลด้านบน (วางตัวลงด้านล่างเล็กน้อย) -->
    <path d="M400 176c-116 0-196 84-196 208 0 104 44 190 116 226 34 17 128 17 162 0 72-36 114-122 114-226 0-124-80-208-196-208z"
          fill="url(#shell)"/>
    <!-- ขอบล่าง -->
    <path d="M400 610c-38 0-72-7-98-20 84 20 190 20 274 0-26 13-58 20-96 20z"
          fill="url(#shellEdge)" opacity="0.55"/>
    <!-- ตัวเติมสีมันวาวด้านบน -->
    <ellipse cx="400" cy="300" rx="150" ry="130" fill="url(#sheen)"/>
  </g>

  <!-- รอยแยกฝาคลิกสองข้าง -->
  <path d="M400 186v126" stroke="#a8adba" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M400 312c-46-8-92-26-128-56M400 312c46-8 92-26 128-56"
        stroke="#c2c7d2" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- ลูกกลิ้งเลื่อน -->
  <rect x="378" y="236" width="44" height="72" rx="22" fill="url(#wheel)"/>
  <rect x="386" y="250" width="28" height="44" rx="14" fill="#5b6070" opacity="0.65"/>

  <!-- ไฟสถานะแบตเตอรี่ (สีแอปเปิลบลู = จุดเดียวที่มีสี) -->
  <circle cx="400" cy="452" r="11" fill="#0071e7"/>
  <circle cx="400" cy="452" r="20" fill="#0071e7" opacity="0.18"/>
</svg>