<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="หัวชาร์จเร็ว GaN 65W">
  <!-- charger.svg — หัวชาร์จเร็ว GaN 65W (2 ช่อง USB-C) · สไตล์เดียวกับ mouse.svg -->
  <defs>
    <linearGradient id="chBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfdfe"/><stop offset="0.45" stop-color="#dfe3ea"/><stop offset="1" stop-color="#a8aeb9"/>
    </linearGradient>
    <linearGradient id="chFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#333944"/><stop offset="1" stop-color="#16191f"/>
    </linearGradient>
    <linearGradient id="chSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="chDrop" x="-30%" y="-25%" width="160%" height="155%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#1d1d1f" flood-opacity="0.22"/>
    </filter>
  </defs>

  <ellipse cx="400" cy="628" rx="168" ry="28" fill="#1d1d1f" opacity="0.13"/>

  <g filter="url(#chDrop)">
    <!-- หัวตัว (ทรงเตี้ย มุมมอง 3/4) -->
    <rect x="278" y="272" width="244" height="252" rx="42" fill="url(#chBody)"/>
    <rect x="278" y="272" width="244" height="252" rx="42" fill="url(#chSheen)"/>
    <!-- ขอบล่าง -->
    <rect x="278" y="500" width="244" height="24" rx="12" fill="#9aa0ae" opacity="0.5"/>

    <!-- หน้าปลั๊ก (แผงเข้ม) -->
    <rect x="302" y="296" width="196" height="204" rx="32" fill="url(#chFace)"/>
    <!-- ช่อง USB-C 2 ช่อง -->
    <rect x="342" y="346" width="48" height="18" rx="9" fill="#0c0f14"/>
    <rect x="410" y="346" width="48" height="18" rx="9" fill="#0c0f14"/>
    <rect x="348" y="351" width="36" height="8" rx="4" fill="#3f4653"/>
    <rect x="416" y="351" width="36" height="8" rx="4" fill="#3f4653"/>
    <!-- ตัวบอกกำลัง -->
    <text x="400" y="424" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif"
          font-size="34" font-weight="700" fill="#e8eaef">65W</text>
    <text x="400" y="452" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif"
          font-size="16" font-weight="600" fill="#0071e7" letter-spacing="1.5">GaN</text>

    <!-- ขาเสียบ UK -->
    <rect x="352" y="238" width="22" height="40" rx="7" fill="#aeb4c0"/>
    <rect x="426" y="238" width="22" height="40" rx="7" fill="#aeb4c0"/>
    <rect x="352" y="224" width="22" height="16" rx="7" fill="#8b91a0"/>
    <rect x="426" y="224" width="22" height="16" rx="7" fill="#8b91a0"/>
  </g>
</svg>