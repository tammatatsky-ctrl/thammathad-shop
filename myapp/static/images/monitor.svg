<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="จอมอนิเตอร์ 27 นิ้ว 4K">
  <!-- monitor.svg — จอมอนิเตอร์ 27" IPS 4K · สไตล์เดียวกับ mouse.svg -->
  <defs>
    <linearGradient id="mnBezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a606c"/><stop offset="1" stop-color="#23262e"/>
    </linearGradient>
    <linearGradient id="mnScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1723"/><stop offset="0.5" stop-color="#1d3049"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="mnStand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4f7"/><stop offset="1" stop-color="#b7bcc7"/>
    </linearGradient>
    <linearGradient id="mnBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfe"/><stop offset="1" stop-color="#c8ccd6"/>
    </linearGradient>
    <filter id="mnDrop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#1d1d1f" flood-opacity="0.2"/>
    </filter>
  </defs>

  <ellipse cx="400" cy="656" rx="240" ry="26" fill="#1d1d1f" opacity="0.13"/>

  <g filter="url(#mnDrop)">
    <!-- ขาตั้ง + ฐาน -->
    <rect x="374" y="500" width="52" height="118" rx="16" fill="url(#mnStand)"/>
    <path d="M268 634h264a16 16 0 0 1 16 16v4a16 16 0 0 1-16 16H268a16 16 0 0 1-16-16v-4a16 16 0 0 1 16-16z"
          fill="url(#mnBase)"/>

    <!-- กรอบจอ -->
    <rect x="118" y="182" width="564" height="344" rx="22" fill="url(#mnBezel)"/>
    <!-- จอ -->
    <rect x="136" y="200" width="528" height="308" rx="10" fill="url(#mnScreen)"/>

    <!-- สิ่งที่อยู่บนจอ: ไฟล์เปิด (สื่อว่าเป็นจอทำงานจริง ไม่ใช่กล่องเปล่า) -->
    <rect x="162" y="226" width="212" height="14" rx="7" fill="#3b4658"/>
    <rect x="162" y="252" width="286" height="14" rx="7" fill="#333d4d"/>
    <rect x="162" y="278" width="164" height="14" rx="7" fill="#2c3543"/>
    <!-- ภาพตัวอย่าง -->
    <rect x="470" y="226" width="170" height="128" rx="10" fill="#243247"/>
    <path d="M470 320l44-40 38 30 44-52 44 40v56H470z" fill="#31465f"/>
    <circle cx="508" cy="256" r="13" fill="#0071e7" opacity="0.75"/>
    <!-- แถบงานล่าง -->
    <rect x="136" y="468" width="528" height="40" rx="8" fill="#0a111b"/>
    <circle cx="168" cy="488" r="9" fill="#0071e7"/>
    <circle cx="200" cy="488" r="9" fill="#3b4658"/>
    <circle cx="232" cy="488" r="9" fill="#3b4658"/>

    <!-- กล้อง + ไฟสถานะ ขอบจอ -->
    <circle cx="400" cy="513" r="6" fill="#0071e7"/>
    <circle cx="400" cy="513" r="12" fill="#0071e7" opacity="0.22"/>
    <circle cx="648" cy="513" r="4" fill="#0071e7" opacity="0.8"/>
  </g>
</svg>